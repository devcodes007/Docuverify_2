# Render deployment config for the DocuVerify v2 backend.
# Import this repo into Render as a "Blueprint" (New -> Blueprint, point at
# this repo) and Render will read this file and provision the service
# below automatically, or configure a single Web Service manually using
# the same values if you prefer not to use Blueprints.
services:
  - type: web
    name: docuverify-backend
    runtime: docker
    plan: standard          # torch+transformers need >512MB RAM; the free
                             # plan's 512MB is too tight in practice -- see
                             # README "Production Deployment" for sizing notes
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        value: mock          # placeholder: switch to "ollama" (with a
                              # reachable host) or "openai_compatible" (set
                              # OPENAI_API_KEY below) before real use
      - key: LLM_MODEL
        value: llama3.1
      - key: LLM_API_BASE
        value: http://localhost:11434
      - key: OPENAI_API_KEY
        sync: false           # set manually in the Render dashboard, never in git
      - key: HF_TOKEN
        sync: false
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIM
        value: "384"
      - key: VECTOR_DB_PATH
        value: /app/data/processed/chroma
      - key: VECTOR_DB_COLLECTION
        value: docuverify_chunks
      - key: BM25_INDEX_PATH
        value: /app/data/processed/bm25_index.pkl
      - key: TOP_K
        value: "8"
      - key: HYBRID_ALPHA
        value: "0.6"
      - key: MAX_RETRIEVAL_ATTEMPTS
        value: "3"
      - key: EVIDENCE_SUFFICIENCY_THRESHOLD
        value: "0.55"
      - key: CHUNK_SIZE_TOKENS
        value: "350"
      - key: CHUNK_OVERLAP_TOKENS
        value: "50"
      - key: GROUNDEDNESS_MODEL
        value: /app/models/groundedness-classifier
      - key: GROUNDEDNESS_BASE_MODEL
        value: microsoft/deberta-v3-small
      - key: GROUNDEDNESS_MAX_LENGTH
        value: "512"
      - key: RAW_DATA_DIR
        value: /app/data/raw
      - key: AUTO_INGEST_ON_STARTUP
        value: "true"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "30"
      # Set this to your actual Vercel domain(s) once deployed, comma-separated,
      # e.g. "https://docuverify.vercel.app,https://docuverify-git-main-you.vercel.app"
      - key: CORS_ORIGINS
        value: https://REPLACE-WITH-YOUR-VERCEL-DOMAIN.vercel.app
    disk:
      # Optional: without this, data/processed and models/ live on Render's
      # ephemeral filesystem and are rebuilt by auto-ingest on every deploy/
      # restart (fine for the bundled sample corpus). Uncomment to persist
      # a larger ingested corpus and/or a fine-tuned groundedness model
      # across restarts instead of rebuilding indexes each time.
      # name: docuverify-data
      # mountPath: /app/data/processed
      # sizeGB: 1
